<header class="site-navbar">
  <style>
    .site-navbar {
      position: sticky;
      top: 0;
      z-index: 1000;
      width: 100%;
      background: rgba(12, 33, 40, 0.96);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(223, 160, 98, 0.22);
      box-shadow: 0 6px 24px rgba(0, 0, 0, 0.16);
    }

    .nav-container {
      max-width: 1120px;
      margin: 0 auto;
      padding: 0.72rem clamp(1.2rem, 4vw, 2.5rem);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1.5rem;
    }

    .nav-brand {
      display: inline-flex;
      align-items: center;
      gap: 0.65rem;
      flex-shrink: 0;
      padding: 0.15rem 0;
      transition: opacity 0.2s ease;
    }

    .nav-brand:hover,
    .nav-brand:focus-visible {
      opacity: 0.9;
      outline: none;
    }

    .nav-brand__icon {
      height: 42px;
      width: auto;
      display: block;
      filter: brightness(2.6) contrast(1.1) saturate(0.75) drop-shadow(0 2px 6px rgba(0, 0, 0, 0.35));
    }

    .nav-brand__wordmark {
      height: 36px;
      width: auto;
      display: block;
    }

    .nav-menu {
      display: flex;
      align-items: center;
      gap: 1.55rem;
    }

    .nav-link {
      position: relative;
      display: inline-flex;
      align-items: center;
      padding: 0.35rem 0;
      font-family: var(--font-body, 'DM Sans', sans-serif);
      font-size: 0.84rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.11em;
      color: rgba(246, 241, 232, 0.84) !important;
      white-space: nowrap;
      transition: color 0.2s ease;
    }

    .nav-link::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: -2px;
      height: 2px;
      background: #dfa062;
      transform: scaleX(0);
      transform-origin: left center;
      transition: transform 0.24s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .nav-link:hover,
    .nav-link:focus-visible,
    .nav-link.selected {
      color: #fcfaf5 !important;
      outline: none;
    }

    .nav-link:hover::after,
    .nav-link:focus-visible::after,
    .nav-link.selected::after {
      transform: scaleX(1);
    }

    .nav-cta {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-left: 0.45rem;
      padding: 0.58rem 1.25rem;
      border-radius: 6px;
      font-family: var(--font-body, 'DM Sans', sans-serif);
      font-size: 0.84rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      white-space: nowrap;
      color: #0c2128 !important;
      background: #dfa062;
      border: 1.5px solid #dfa062;
      transition: background 0.2s ease, transform 0.2s ease, border-color 0.2s ease;
    }

    .nav-cta:hover,
    .nav-cta:focus-visible {
      background: #e9b178;
      border-color: #e9b178;
      transform: translateY(-1px);
      color: #0c2128 !important;
      outline: none;
    }

    .nav-cta.selected {
      background: transparent;
      color: #dfa062 !important;
      border-color: #dfa062;
    }

    .nav-toggle {
      display: none;
      align-items: center;
      justify-content: center;
      width: 42px;
      height: 42px;
      padding: 0;
      border-radius: 6px;
      border: 1px solid rgba(246, 241, 232, 0.24);
      background: transparent;
      color: #f6f1e8;
      cursor: pointer;
      transition: background 0.2s ease, border-color 0.2s ease;
    }

    .nav-toggle:hover,
    .nav-toggle:focus-visible {
      background: rgba(246, 241, 232, 0.1);
      border-color: rgba(223, 160, 98, 0.7);
      outline: none;
    }

    /* Mobile drawer */
    .nav-overlay {
      position: fixed;
      inset: 0;
      background: rgba(7, 20, 24, 0.72);
      z-index: 1090;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: opacity 0.24s ease, visibility 0.24s ease;
    }

    .nav-overlay.open {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
    }

    .nav-drawer {
      position: fixed;
      top: 0;
      right: 0;
      width: min(320px, 86vw);
      height: 100dvh;
      background: #0c2128;
      border-left: 1px solid rgba(223, 160, 98, 0.22);
      box-shadow: -12px 0 36px rgba(0, 0, 0, 0.38);
      z-index: 1100;
      padding: 1.4rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transform: translateX(105%);
      visibility: hidden;
      pointer-events: none;
      transition: transform 0.28s cubic-bezier(0.22, 1, 0.36, 1), visibility 0.28s ease;
    }

    .nav-drawer.open {
      transform: translateX(0);
      visibility: visible;
      pointer-events: auto;
    }

    .nav-drawer__top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 1rem;
      border-bottom: 1px solid rgba(246, 241, 232, 0.12);
    }

    .nav-drawer__title {
      font-family: var(--font-body, 'DM Sans', sans-serif);
      font-size: 0.78rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.16em;
      color: #dfa062;
    }

    .nav-close {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 38px;
      height: 38px;
      border-radius: 6px;
      border: 1px solid rgba(246, 241, 232, 0.22);
      background: transparent;
      color: #f6f1e8;
      font-size: 1.45rem;
      line-height: 1;
      cursor: pointer;
    }

    .nav-close:hover,
    .nav-close:focus-visible {
      background: rgba(246, 241, 232, 0.1);
      outline: none;
    }

    .nav-drawer__links {
      display: flex;
      flex-direction: column;
      gap: 0.2rem;
      margin-top: 1.2rem;
    }

    .nav-drawer__links .nav-link {
      padding: 0.8rem 0;
      font-size: 0.96rem;
      border-bottom: 1px solid rgba(246, 241, 232, 0.08);
    }

    .nav-drawer__links .nav-link::after {
      bottom: -1px;
    }

    .nav-drawer__cta {
      margin-top: 1.3rem;
      margin-left: 0;
      width: 100%;
      padding: 0.88rem 1.2rem;
      font-size: 0.9rem;
    }

    .nav-drawer__footer {
      padding-top: 1rem;
      border-top: 1px solid rgba(246, 241, 232, 0.12);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
    }

    .nav-drawer__social-label {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: rgba(246, 241, 232, 0.6);
    }

    .nav-drawer__socials {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .nav-drawer__social-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 36px;
      height: 36px;
      border-radius: 6px;
      border: 1px solid rgba(246, 241, 232, 0.2);
      color: #f6f1e8 !important;
      text-decoration: none !important;
      transition: background 0.2s ease, border-color 0.2s ease;
    }

    .nav-drawer__social-btn:hover {
      background: rgba(223, 160, 98, 0.18);
      border-color: #dfa062;
    }

    @media (max-width: 900px) {
      .nav-menu {
        display: none;
      }

      .nav-toggle {
        display: inline-flex;
      }

      .nav-brand__icon {
        height: 34px;
      }

      .nav-brand__wordmark {
        height: 28px;
      }
    }

    @media (prefers-reduced-motion: reduce) {

      .nav-brand,
      .nav-link,
      .nav-link::after,
      .nav-cta,
      .nav-overlay,
      .nav-drawer {
        transition: none;
      }
    }
  </style>

  <div class="nav-container">
    <a href="{{ site.baseurl }}/" class="nav-brand" aria-label="Skånska Vågor – Startsida">
      <img src="{{ site.baseurl }}/public/img/skanska_vagor_logo_transparent_icon.png" alt="" aria-hidden="true"
        class="nav-brand__icon" />
      <img src="{{ site.baseurl }}/public/img/skanska_vagor_logo_transparent_text.png" alt="Skånska Vågor"
        class="nav-brand__wordmark" />
    </a>

    <nav class="nav-menu" aria-label="Huvudmeny">
      <a href="{{ site.baseurl }}/index.html"
        class="nav-link{% if page.url == '/' or page.url == '/index.html' %} selected{% endif %}">Hem</a>
      <a href="{{ site.baseurl }}/spelningar.html"
        class="nav-link{% if page.url == '/spelningar.html' %} selected{% endif %}">Spelningar</a>
      <a href="{{ site.baseurl }}/medlemmar.html"
        class="nav-link{% if page.url == '/medlemmar.html' %} selected{% endif %}">Bandmedlemmar</a>
      <a href="{{ site.baseurl }}/galleri.html"
        class="nav-link{% if page.url == '/galleri.html' %} selected{% endif %}">Galleri</a>
      <a href="{{ site.baseurl }}/bokning.html"
        class="nav-cta{% if page.url == '/bokning.html' %} selected{% endif %}">Boka oss</a>
    </nav>

    <button class="nav-toggle" type="button" aria-label="Öppna meny" aria-expanded="false"
      aria-controls="mobile-nav-drawer">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
        stroke-linecap="round" aria-hidden="true">
        <path d="M4 7h16M4 12h16M4 17h16" />
      </svg>
    </button>
  </div>
</header>

<div class="nav-overlay" aria-hidden="true"></div>

  <div>
    <div class="nav-drawer__top">
      <span class="nav-drawer__title">Skånska Vågor</span>

    <nav class="nav-drawer__links" aria-label="Mobilnavigering">
      <a href="{{ site.baseurl }}/index.html"

      <a href="{{ site.baseurl }}/spelningar.html"

      <a href="{{ site.baseurl }}/medlemmar.html"
        class="nav-link{% if page.url == '/medlemmar.html' %} selected{% endif %}">Bandmedlemmar</a>
      <a href="{{ site.baseurl }}/galleri.html"

      <a href="{{ site.baseurl }}/bokning.html"

    </nav>
  </div>

  <div class="nav-drawer__footer">
    <span class="nav-drawer__social-label">Följ oss</span>
    <div class="nav-drawer__socials">
      <a href="https://www.facebook.com/profile.php?id=61576691256871" target="_blank" rel="noopener noreferrer"
        aria-label="Facebook" class="nav-drawer__social-btn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path
            d="M22.675 0h-21.35C.595 0 0 .592 0 1.326v21.348C0 23.408.595 24 1.325 24h11.495v-9.294H9.692v-3.622h3.128V8.413c0-3.1 1.893-4.788 4.659-4.788 1.325 0 2.463.099 2.797.143v3.24l-1.918.001c-1.504 0-1.797.715-1.797 1.763v2.313h3.587l-.467 3.622h-3.12V24h6.116C23.406 24 24 23.408 24 22.674V1.326C24 .592 23.406 0 22.675 0" />
        </svg>
      </a>
      <a href="https://www.instagram.com/skanskavagorofficial" target="_blank" rel="noopener noreferrer"
        aria-label="Instagram" class="nav-drawer__social-btn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"

          <rect x="2" y="2" width="20" height="20" rx="5" />

</aside>

<script>
  (function () {
    var toggle = document.querySelector('.nav-toggle');
    var overlay = document.querySelector('.nav-overlay');
    var drawer = document.querySelector('.nav-drawer');
    var closeBtn = document.querySelector('.nav-close');
    if (!toggle || !overlay || !drawer || !closeBtn) return;

    var lastFocused = null;

    function open() {
      lastFocused = document.activeElement;
      overlay.classList.add('open');
      drawer.classList.add('open');
      drawer.setAttribute('aria-hidden', 'false');
      drawer.setAttribute('role', 'dialog');
      drawer.setAttribute('aria-modal', 'true');
      overlay.setAttribute('aria-hidden', 'false');
      toggle.setAttribute('aria-expanded', 'true');
      document.addEventListener('keydown', trapTabKey);
      document.body.style.overflow = 'hidden';
      closeBtn.focus();
    }

    function close() {
      if (!drawer.classList.contains('open')) return;
      overlay.classList.remove('open');
      drawer.classList.remove('open');
      drawer.setAttribute('aria-hidden', 'true');
      drawer.removeAttribute('role');
      drawer.removeAttribute('aria-modal');
      overlay.setAttribute('aria-hidden', 'true');
      toggle.setAttribute('aria-expanded', 'false');
      document.removeEventListener('keydown', trapTabKey);
      document.body.style.overflow = '';
      try {
        if (lastFocused && typeof lastFocused.focus === 'function') lastFocused.focus();
      } catch (e) { }
    }

    function trapTabKey(e) {
      if (e.key !== 'Tab' || !drawer.classList.contains('open')) return;
      var focusable = Array.prototype.slice.call(
        drawer.querySelectorAll('a[href], button:not([disabled]), [tabindex]:not([tabindex="-1"])')
      );
      if (!focusable.length) {
        e.preventDefault();
        return;
      }
      var first = focusable[0];
      var last = focusable[focusable.length - 1];
      if (e.shiftKey) {
        if (document.activeElement === first) {
          e.preventDefault();
          last.focus();
        }
      } else if (document.activeElement === last) {
        e.preventDefault();
        first.focus();
      }
    }

    toggle.addEventListener('click', function () {
      if (drawer.classList.contains('open')) close();
      else open();
    });
    closeBtn.addEventListener('click', close);
    overlay.addEventListener('click', close);
    Array.prototype.slice.call(drawer.querySelectorAll('a')).forEach(function (link) {
      link.addEventListener('click', close);
    });
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') close();
    });
  })();
</script>
