<header class="site-navbar">
  <style>
    .site-navbar {
      position: sticky;
      top: 0;
      z-index: 1000;
      width: 100%;
      background: rgba(11, 34, 40, 0.92);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 8px 28px rgba(0, 0, 0, 0.18);
    }

    .nav-container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0.65rem clamp(1rem, 3vw, 2rem);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }

    .nav-brand {
      display: inline-flex;
      align-items: center;
      gap: 0.72rem;
      flex-shrink: 0;
      padding: 0.2rem 0;
      transition: transform 0.2s ease, opacity 0.2s ease;
    }

    .nav-brand:hover,
    .nav-brand:focus-visible {
      transform: translateY(-1px);
      opacity: 0.96;
    }

    .nav-brand__icon-wrap {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 44px;
      height: 36px;
      padding: 4px 5px;
      border-radius: 10px;
      background: rgba(244, 248, 248, 0.96);
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.22);
    }

    .nav-brand__icon {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    .nav-brand__wordmark {
      height: 28px;
      width: auto;
      display: block;
      filter: drop-shadow(0 2px 6px rgba(0, 0, 0, 0.3));
    }

    .nav-menu {
      display: flex;
      align-items: center;
      gap: 0.35rem;
    }

    .nav-link {
      position: relative;
      display: inline-flex;
      align-items: center;
      gap: 0.48rem;
      padding: 0.56rem 0.95rem;
      border-radius: 999px;
      font-family: var(--font-display, 'Outfit', sans-serif);
      font-size: 0.95rem;
      font-weight: 500;
      color: rgba(255, 255, 255, 0.86) !important;
      background: transparent;
      white-space: nowrap;
      transition: background 0.2s ease, color 0.2s ease, box-shadow 0.2s ease, transform 0.2s ease;
    }

    .nav-link .nav-icon {
      width: 18px;
      height: 18px;
      flex-shrink: 0;
      opacity: 0.9;
    }

    .nav-link:hover,
    .nav-link:focus-visible {
      background: rgba(255, 255, 255, 0.1);
      color: #ffffff !important;
      outline: none;
    }

    .nav-link.selected {
      background: rgba(38, 166, 154, 0.22);
      color: #ffffff !important;
      box-shadow: inset 0 0 0 1px rgba(38, 166, 154, 0.55);
      font-weight: 600;
    }

    .nav-link.selected .nav-icon {
      color: #80cbc4;
    }

    .nav-cta {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      margin-left: 0.55rem;
      padding: 0.6rem 1.2rem;
      border-radius: 999px;
      font-family: var(--font-display, 'Outfit', sans-serif);
      font-size: 0.95rem;
      font-weight: 700;
      white-space: nowrap;
      color: #0b2228 !important;
      background: linear-gradient(135deg, #e59849 0%, #d47e28 100%);
      box-shadow: 0 4px 14px rgba(212, 126, 40, 0.34);
      transition: transform 0.2s ease, box-shadow 0.2s ease, filter 0.2s ease;
    }

    .nav-cta:hover,
    .nav-cta:focus-visible {
      transform: translateY(-1px);
      box-shadow: 0 8px 20px rgba(229, 152, 73, 0.42);
      filter: brightness(1.06);
      color: #0b2228 !important;
      outline: none;
    }

    .nav-cta.selected {
      box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.45), 0 6px 18px rgba(212, 126, 40, 0.4);
    }

    .nav-toggle {
      display: none;
      align-items: center;
      justify-content: center;
      width: 44px;
      height: 44px;
      padding: 0;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      background: rgba(255, 255, 255, 0.08);
      color: #fff;
      cursor: pointer;
      transition: background 0.2s ease, border-color 0.2s ease;
    }

    .nav-toggle:hover,
    .nav-toggle:focus-visible {
      background: rgba(255, 255, 255, 0.16);
      border-color: rgba(255, 255, 255, 0.4);
      outline: none;
    }

    /* Mobile drawer */
    .nav-overlay {
      position: fixed;
      inset: 0;
      background: rgba(6, 18, 22, 0.68);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      z-index: 1090;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: opacity 0.24s ease, visibility 0.24s ease;
    }

    .nav-overlay.open {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
    }

    .nav-drawer {
      position: fixed;
      top: 0;
      right: 0;
      width: min(330px, 86vw);
      height: 100dvh;
      background: linear-gradient(180deg, rgba(11, 34, 40, 0.98) 0%, rgba(16, 51, 60, 0.98) 100%);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-left: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: -12px 0 36px rgba(0, 0, 0, 0.35);
      z-index: 1100;
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transform: translateX(105%);
      visibility: hidden;
      pointer-events: none;
      transition: transform 0.28s cubic-bezier(0.22, 1, 0.36, 1), visibility 0.28s ease;
    }

    .nav-drawer.open {
      transform: translateX(0);
      visibility: visible;
      pointer-events: auto;
    }

    .nav-drawer__top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 1rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .nav-drawer__title {
      font-family: var(--font-display, 'Outfit', sans-serif);
      font-size: 0.9rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: #80cbc4;
    }

    .nav-close {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 40px;
      height: 40px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.18);
      background: rgba(255, 255, 255, 0.08);
      color: #fff;
      font-size: 1.5rem;
      line-height: 1;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    .nav-close:hover,
    .nav-close:focus-visible {
      background: rgba(255, 255, 255, 0.18);
      outline: none;
    }

    .nav-drawer__links {
      display: flex;
      flex-direction: column;
      gap: 0.45rem;
      margin-top: 1.2rem;
    }

    .nav-drawer__links .nav-link {
      width: 100%;
      padding: 0.85rem 1rem;
      font-size: 1.05rem;
      border-radius: 12px;
    }

    .nav-drawer__cta {
      margin-top: 0.85rem;
      margin-left: 0;
      width: 100%;
      justify-content: center;
      padding: 0.9rem 1.2rem;
      font-size: 1.02rem;
      border-radius: 14px;
    }

    .nav-drawer__footer {
      padding-top: 1rem;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
    }

    .nav-drawer__social-label {
      font-size: 0.85rem;
      color: rgba(255, 255, 255, 0.65);
    }

    .nav-drawer__socials {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .nav-drawer__social-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.1);
      color: #fff !important;
      text-decoration: none !important;
      transition: background 0.2s ease;
    }

    .nav-drawer__social-btn:hover {
      background: rgba(38, 166, 154, 0.35);
    }

    @media (max-width: 900px) {
      .nav-menu {
        display: none;
      }

      .nav-toggle {
        display: inline-flex;
      }

      .nav-brand__wordmark {
        height: 24px;
      }

      .nav-brand__icon-wrap {
        width: 40px;
        height: 32px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .nav-brand,
      .nav-link,
      .nav-cta,
      .nav-overlay,
      .nav-drawer {
        transition: none;
      }
    }
  </style>

<script>
  (function () {
    var toggle = document.querySelector('.nav-toggle');
    var overlay = document.querySelector('.nav-overlay');
    var drawer = document.querySelector('.nav-drawer');
    var closeBtn = document.querySelector('.nav-close');
    if (!toggle || !overlay || !drawer || !closeBtn) return;

    var lastFocused = null;

    function open() {
      lastFocused = document.activeElement;
      overlay.classList.add('open');
      drawer.classList.add('open');
      drawer.setAttribute('aria-hidden', 'false');
      drawer.setAttribute('role', 'dialog');
      drawer.setAttribute('aria-modal', 'true');
      overlay.setAttribute('aria-hidden', 'false');
      toggle.setAttribute('aria-expanded', 'true');
      document.addEventListener('keydown', trapTabKey);
      document.body.style.overflow = 'hidden';
      closeBtn.focus();
    }

    function close() {
      if (!drawer.classList.contains('open')) return;
      overlay.classList.remove('open');
      drawer.classList.remove('open');
      drawer.setAttribute('aria-hidden', 'true');
      drawer.removeAttribute('role');
      drawer.removeAttribute('aria-modal');
      overlay.setAttribute('aria-hidden', 'true');
      toggle.setAttribute('aria-expanded', 'false');
      document.removeEventListener('keydown', trapTabKey);
      document.body.style.overflow = '';
      try {
        if (lastFocused && typeof lastFocused.focus === 'function') lastFocused.focus();
      } catch (e) { }
    }

    function trapTabKey(e) {
      if (e.key !== 'Tab' || !drawer.classList.contains('open')) return;
      var focusable = Array.prototype.slice.call(
        drawer.querySelectorAll('a[href], button:not([disabled]), [tabindex]:not([tabindex="-1"])')
      );
      if (!focusable.length) {
        e.preventDefault();
        return;
      }
      var first = focusable[0];
      var last = focusable[focusable.length - 1];
      if (e.shiftKey) {
        if (document.activeElement === first) {
          e.preventDefault();
          last.focus();
        }
      } else if (document.activeElement === last) {
        e.preventDefault();
        first.focus();
      }
    }

    toggle.addEventListener('click', function () {
      if (drawer.classList.contains('open')) close();
      else open();
    });
    closeBtn.addEventListener('click', close);
    overlay.addEventListener('click', close);
    Array.prototype.slice.call(drawer.querySelectorAll('a')).forEach(function (link) {
      link.addEventListener('click', close);
    });
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') close();
    });
  })();
</script>
