<section class="block on-dark{% if include.compact %} tight{% endif %}" id="boka">
  <div class="wrap book">
    <div class="reveal">
      {% if include.compact %}
      <span class="eyebrow">Så går det till</span>
      {% else %}
      <span class="eyebrow">Bokning</span>
      <h2 class="h2">Boka oss</h2>
      {% endif %}
      <ol class="steps">
        <li><b>Berätta</b> vad du har planerat: fest, krog, bröllop eller festival.</li>
        <li><b>Vi hör av oss</b> så snart vi kan och stämmer av detaljerna.</li>
        <li><b>Vi kommer</b> och spelar.</li>
      </ol>
      <p class="direct">Hellre mejl? <a class="mail" href="mailto:{{ site.email }}">{{ site.email }}</a></p>
    </div>
    <form class="reveal booking-form" action="https://formspree.io/f/xnnzegyr" method="POST">
      <input type="hidden" name="_subject" value="Bokningsförfrågan via skanskavagor.se">
      <div class="hp" aria-hidden="true"><label for="gotcha">Lämna tomt</label><input id="gotcha" type="text" name="_gotcha" tabindex="-1" autocomplete="off"></div>
      <div class="row">
        <div>
          <label for="namn">Ditt namn</label>
          <input id="namn" type="text" name="namn" autocomplete="name" required>
        </div>
        <div>
          <label for="email">Din e-post</label>
          <input id="email" type="email" name="email" autocomplete="email" required>
        </div>
      </div>
      <div class="row">
        <div>
          <label for="typ">Typ av evenemang</label>
          <select id="typ" name="typ">
            <option>Fest</option>
            <option>Bröllop</option>
            <option>Krog eller bar</option>
            <option>Festival</option>
            <option>Företagsevent</option>
            <option>Annat</option>
          </select>
        </div>
        <div>
          <label for="datum">Datum <span class="opt">(om du vet)</span></label>
          <input id="datum" type="date" name="datum">
        </div>
      </div>
      <div>
        <label for="meddelande">Berätta om evenemanget</label>
        <textarea id="meddelande" name="meddelande" rows="4" placeholder="Plats, ungefär hur många gäster och vad ni önskar." required></textarea>
      </div>
      <div class="form-foot">
        <button class="btn" type="submit">Skicka förfrågan</button>
        <p class="form-status" role="status" aria-live="polite"></p>
      </div>
    </form>
  </div>
</section>
